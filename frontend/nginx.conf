server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: every path that is not a real file is the app's own route, so
  # it must return index.html rather than 404. Without this, refreshing on
  # /lender/unguka/applications gives the driver a 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets never change under the same name, so they cache for a year.
  # index.html must not, or a deploy leaves people on the previous bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
