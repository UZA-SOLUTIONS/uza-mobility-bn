# Every push and pull request runs exactly what a developer runs locally.
#
# The point is that standards stop depending on discipline. Nobody has to remember to
# run the suite before pushing and nobody has to police it in review — a red tick does
# that, consistently, for everyone.
#
# `npm run verify` is deliberately the same command here and on a laptop. When CI fails
# you reproduce it with one command instead of guessing which flags the pipeline used.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # A new push supersedes the run in progress for the same branch. Without this, a
  # busy branch queues runs that are already out of date.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Prisma generates its client from the schema, and `prisma migrate deploy`
      # needs somewhere to apply migrations. Running against a real Postgres also
      # means a broken migration fails here rather than on a deployment.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uza
          POSTGRES_PASSWORD: uza
          POSTGRES_DB: uza_mobility_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uza"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://uza:uza@localhost:5432/uza_mobility_test?schema=public
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: uza_mobility_test
      GRIDFS_BUCKET_NAME: uploads
      JWT_SECRET: ci-only-not-a-real-secret
      PUBLIC_UPLOAD_BASE_URL: http://localhost:7000/uploads

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy

      # Types, then lint, then tests — fastest and clearest signal first.
      - run: npm run verify

      # The image is part of the deliverable. A build that only works on a laptop is
      # not a build, and this is the step that catches a missing file in the Docker
      # context before a deployment does.
      - name: Build the production image
        run: docker build -t uza-mobility-api:ci .

  audit:
    # Advisory, and deliberately separate: a new CVE published overnight must not turn
    # every branch red, but it must be visible.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
